services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailer
      POSTGRES_PASSWORD: mailer
      POSTGRES_DB: mailer
    ports:
      - "5442:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # AOF persistence so delayed BullMQ jobs survive a Redis restart too
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6390:6379"
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
